name: idle_fantasy
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  http: ^1.6.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/monsters.json
    - assets/sprites/hero/
    - assets/sprites/pet/
    - assets/sprites/monster/
    - assets/sprites/boss/
    - assets/backgrounds/forest/

  fonts:
    # 갈무리 — SIL 오픈 폰트 라이선스. 상업 사용 가능. assets/fonts/Galmuri-LICENSE.txt 참고.
    # 픽셀 무대에 시스템 폰트를 쓰면 게임이 아니라 설정 화면처럼 보인다.
    - family: Galmuri
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
    - family: GalmuriBig
      fonts:
        - asset: assets/fonts/Galmuri14.ttf
